trigger: none

pool:
  vmImage: ubuntu-latest

steps:

- checkout: self

- task: AzureCLI@2
  displayName: 'Test Azure Connection'
  inputs:
    azureSubscription: 'terraform-azure-service-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Successfully authenticated to Azure"
      az account show --query "{Subscription:name, SubscriptionId:id}" --output table

- script: |
    sudo apt-get update
    sudo apt-get install -y gnupg software-properties-common curl

    wget -O- https://apt.releases.hashicorp.com/gpg | \
      gpg --dearmor | \
      sudo tee /usr/share/keyrings/hashicorp-archive-keyring.gpg > /dev/null

    echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
      sudo tee /etc/apt/sources.list.d/hashicorp.list

    sudo apt-get update
    sudo apt-get install -y terraform

    terraform version
  displayName: 'Install Terraform'

- task: AzureCLI@2
  displayName: 'Terraform Init'
  inputs:
    azureSubscription: 'terraform-azure-service-connection'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    inlineScript: |
      export ARM_USE_CLI=true
      export ARM_USE_AZUREAD=true
      export ARM_TENANT_ID=$(az account show --query tenantId -o tsv)

      echo "Running Terraform Init..."
      terraform init -reconfigure 

- task: AzureCLI@2
  displayName: 'Terraform Validate and Plan'
  inputs:
    azureSubscription: 'terraform-azure-service-connection'
    addSpnToEnvironment: true
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    inlineScript: |
      export ARM_USE_OIDC=true
      export ARM_USE_AZUREAD=true
      export ARM_CLIENT_ID=$servicePrincipalId
      export ARM_TENANT_ID=$tenantId
      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
      export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID=$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

      echo "Validating Terraform..."
      terraform validate

      echo "Running Terraform Plan..."
      terraform plan

- task: AzureCLI@2
  displayName: 'Terraform Apply'
  inputs:
    azureSubscription: 'terraform-azure-service-connection'
    addSpnToEnvironment: true
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    workingDirectory: '$(System.DefaultWorkingDirectory)/terraform'
    inlineScript: |
      export ARM_USE_OIDC=true
      export ARM_USE_AZUREAD=true
      export ARM_CLIENT_ID=$servicePrincipalId
      export ARM_TENANT_ID=$tenantId
      export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
      export ARM_OIDC_AZURE_SERVICE_CONNECTION_ID=$AZURESUBSCRIPTION_SERVICE_CONNECTION_ID

      echo "Applying Terraform configuration..."
      terraform apply -auto-approve